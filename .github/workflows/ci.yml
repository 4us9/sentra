name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentra
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d sentra"
          --health-interval 5s --health-timeout 5s --health-retries 10
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      # setup-node resolves the pnpm cache path during this next step, so pnpm
      # must be on PATH before setup-node is asked to cache it.
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Postgres schema
        run: pnpm --filter @sentra/db migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sentra?schema=public
      # Offline by construction: simulated processors, no model, never reads .env.
      - name: Build, type check and test
        run: pnpm turbo run build typecheck test
        env:
          SENTRA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sentra?schema=public

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No secrets or runtime data in the repository
        run: |
          set -e
          if git ls-files | grep -E '(^|/)\.env$|\.key$|^data/db\.json$'; then
            echo "secret or runtime data file is tracked"; exit 1
          fi
          if git grep -nE 'sk_live_|sk-ant-[A-Za-z0-9]|A21AA[A-Za-z0-9_-]{20,}' -- . ':!.github' ':!packages/guard/src/log.ts' ':!**/test/**'; then
            echo "credential-shaped string found"; exit 1
          fi
          echo "clean"
