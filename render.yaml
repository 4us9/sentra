# Render blueprint: New -> Blueprint -> pick this repo. Free web service.
# Secrets are entered in the Render dashboard (sync: false), never committed.
services:
  - type: web
    name: sentra
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start:render
    healthCheckPath: /sentra-api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SENTRA_TRUST_PROXY
        value: "1"
      - key: NEXT_PUBLIC_SENTRA_API
        value: /sentra-api
      - key: SENTRA_DEV_PROXY
        value: http://127.0.0.1:4000
      - key: SENTRA_SECRET
        generateValue: true
      # PayPal SANDBOX REST app.
      - key: PAYPAL_BASE
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Optional: Stripe TEST key (sk_test_...). Leave unset and Stripe runs simulated.
      - key: STRIPE_SECRET_KEY
        sync: false
      # Optional: turns on the Claude intent check. Leave unset to use the fallback.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-5-5
      # Keeps a public demo from running up a model bill.
      - key: SENTRA_LLM_HOURLY_CAP
        value: "60"
